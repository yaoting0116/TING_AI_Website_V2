<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TING-AI 語言</title>
  <link rel="stylesheet" href="/static/css/site.css">
  <link rel="stylesheet" href="/static/css/nlp.css">
</head>
<body>
  <div class="container">
    <div class="content">
      <button class="toggle-btn" onclick="toggleMenu()">☰</button>

      <nav class="navbar" id="navbar">
          <a href="/music">音樂</a>
          <a href="/game">遊戲</a>
          <a href="/learning">學習</a>
          <a href="/NLP">語言</a>
          <a href="/">主頁</a>
      </nav>

      <div style="width:100%; display:flex; justify-content:center;">
        <div class="ai-wrapper" id="aiWrapper">
          <div class="ai-live" id="aiLive">
            <div class="ai-live-inner">
              <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;">
              <img src="/static/images/00001-1565672939-2.png" alt="AI Live Placeholder" id="aiLiveImg" onerror="this.style.display='none';document.getElementById('imgFallback').style.display='block';">
              <div id="imgFallback" style="display:none;opacity:.9">請把圖片放到 <code>/static/images/00001-1565672939-2.png</code></div>
            </div>
            </div>
          </div>

          <div class="ai-right">
            <div class="header">
              <div class="title">AI 回答</div>
              <div>
                <button class="btn toggle-memory" id="toggleMemoryBtn">顯示：回覆</button>
              </div>
            </div>
            <div class="ai-messages" id="aiMessages" aria-live="polite" aria-atomic="false"></div>
          </div>

          <div class="input-area">
            <div class="input-top">
              <textarea id="userInput" placeholder="在這裡輸入你的問題，按 Enter 發送（Shift+Enter 換行）"></textarea>
            </div>
            <div class="bottom-bar">
              <button class="btn" id="clearMemoryBtn">清除本機記憶</button>
              <button class="btn" id="sendBtn">發送</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/nlp.js"></script>
</body>
</html>
